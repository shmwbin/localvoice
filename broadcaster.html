<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHM LocalVoice - Broadcaster</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f4f4f9; }
        .box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: inline-block; }
        button { padding: 15px 30px; font-size: 18px; border: none; border-radius: 5px; cursor: pointer; color: white; margin: 10px; }
        #startBtn { background-color: #28a745; }
        #stopBtn { background-color: #dc3545; display: none; }
        #status { margin-top: 20px; font-weight: bold; color: #555; }
    </style>
</head>
<body>

    <div class="box">
        <h2>🎙️ লাইভ সম্প্রচার কন্ট্রোল</h2>
        <button id="startBtn">🔴 লাইভ শুরু করুন</button>
        <button id="stopBtn">⏹️ লাইভ বন্ধ করুন</button>
        <p id="status">স্ট্যাটাস: অফলাইন</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getDatabase, ref, set, onDisconnect } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyChsasjfB-0Yx2r4u2hSx0X2ZPHOYs6TKY",
            authDomain: "localvoice-a3845.firebaseapp.com",
            projectId: "localvoice-a3845",
            storageBucket: "localvoice-a3845.firebasestorage.app",
            messagingSenderId: "916898707708",
            appId: "1:916898707708:web:7b7ad98a86f4a07a02ff79"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const statusRef = ref(db, 'radio_status');

        let peer;
        let localStream;

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusText = document.getElementById('status');

        startBtn.addEventListener('click', async () => {
            try {
                // System audio capture using getDisplayMedia
                const displayStream = await navigator.mediaDevices.getDisplayMedia({
                    video: true, 
                    audio: true
                });
                
                // Extract only the audio track from the display stream
                localStream = new MediaStream([displayStream.getAudioTracks()[0]]);
                
                peer = new Peer(); 
                
                peer.on('open', (id) => {
                    set(statusRef, { isLive: true, broadcasterId: id });
                    onDisconnect(statusRef).set({ isLive: false, broadcasterId: null });

                    statusText.innerText = "স্ট্যাটাস: লাইভ চলছে...";
                    statusText.style.color = "green";
                    startBtn.style.display = "none";
                    stopBtn.style.display = "inline-block";
                });

                peer.on('call', (call) => {
                    call.answer(localStream);
                });

            } catch (err) {
                alert("অডিও ক্যাপচার করতে সমস্যা হচ্ছে: " + err.message);
            }
        });

        stopBtn.addEventListener('click', () => {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            if (peer) {
                peer.destroy();
            }
            set(statusRef, { isLive: false, broadcasterId: null });
            
            statusText.innerText = "স্ট্যাটাস: বন্ধ আছে";
            statusText.style.color = "red";
            startBtn.style.display = "inline-block";
            stopBtn.style.display = "none";
        });
    </script>
</body>
</html>
