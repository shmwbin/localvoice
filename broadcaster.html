<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHM LocalVoice - Admin</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f4f4f9; }
        .box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: inline-block; max-width: 400px; width: 100%; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        button { padding: 12px 25px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; color: white; margin: 10px; width: 100%; }
        #loginBtn { background-color: #007bff; }
        #startBtn { background-color: #28a745; display: none; }
        #stopBtn { background-color: #dc3545; display: none; }
        #status { margin-top: 20px; font-weight: bold; color: #555; }
        #wakeLockStatus { font-size: 12px; color: #888; margin-top: 10px; }
        #broadcastPanel { display: none; }
    </style>
</head>
<body>

    <div class="box">
        <h2>🎙️ অ্যাডমিন লগইন</h2>
        
        <!-- Login Form -->
        <div id="loginPanel">
            <input type="email" id="emailInput" placeholder="ইমেইল দিন" required>
            <input type="password" id="passInput" placeholder="পাসওয়ার্ড দিন" required>
            <button id="loginBtn">লগইন করুন</button>
            <p id="loginError" style="color:red; display:none;">লগইন ব্যর্থ হয়েছে!</p>
        </div>

        <!-- Broadcast Panel -->
        <div id="broadcastPanel">
            <button id="startBtn">🔴 লাইভ শুরু করুন</button>
            <button id="stopBtn">⏹️ লাইভ বন্ধ করুন</button>
            <p id="status">স্ট্যাটাস: অফলাইন</p>
            <p id="wakeLockStatus"></p> <!-- 🛠️ Wake Lock indicator -->
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        import { getDatabase, ref, set, onDisconnect } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyChsasjfB-0Yx2r4u2hSx0X2ZPHOYs6TKY",
            authDomain: "localvoice-a3845.firebaseapp.com",
            projectId: "localvoice-a3845",
            storageBucket: "localvoice-a3845.firebasestorage.app",
            messagingSenderId: "916898707708",
            appId: "1:916898707708:web:7b7ad98a86f4a07a02ff79"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const statusRef = ref(db, 'radio_status');

        let peer, localStream, micStreamObj, displayStreamObj;
        let wakeLock = null; 
        let keepAliveInterval = null; 

        const loginPanel = document.getElementById('loginPanel');
        const broadcastPanel = document.getElementById('broadcastPanel');
        const emailInput = document.getElementById('emailInput');
        const passInput = document.getElementById('passInput');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusText = document.getElementById('status');
        const wakeLockStatus = document.getElementById('wakeLockStatus');
        
        // Handle Login
        loginBtn.addEventListener('click', () => {
            const email = emailInput.value;
            const pass = passInput.value;
            signInWithEmailAndPassword(auth, email, pass)
                .catch((error) => {
                    loginError.style.display = "block";
                    loginError.innerText = "ভুল ইমেইল বা পাসওয়ার্ড!";
                });
        });

        // Check Login Status
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginPanel.style.display = "none";
                broadcastPanel.style.display = "block";
                startBtn.style.display = "inline-block";
                document.querySelector('h2').innerText = "🎙️ লাইভ রেডিও সম্প্রচার";
            } else {
                loginPanel.style.display = "block";
                broadcastPanel.style.display = "none";
            }
        });

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLockStatus.innerText = "⚡ অ্যান্টি-স্লিপ মোড অ্যাক্টিভ (ব্রাউজার সজাগ থাকবে)";
                    wakeLockStatus.style.color = "#28a745";
                    
                    wakeLock.addEventListener('release', () => {
                        console.log('Screen Wake Lock was released');
                    });
                }
            } catch (err) {
                wakeLockStatus.innerText = "⚠️ অ্যান্টি-স্লিপ মোড সাপোর্ট করছে না।";
                wakeLockStatus.style.color = "#dc3545";
            }
        }

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });

        // Broadcast Logic with Automatic Fallback to Screen Sound
        startBtn.addEventListener('click', async () => {
            try {
                micStreamObj = null;
                displayStreamObj = null;

                // ১. প্রথমে মাইক্রোফোন পাওয়ার চেষ্টা করা (Audio Filter Disable করে)
                try {
                    micStreamObj = await navigator.mediaDevices.getUserMedia({ 
                        audio: {
                            echoCancellation: false,
                            autoGainControl: false,
                            noiseSuppression: false,
                            channelCount: 2
                        } 
                    });
                } catch (micErr) {
                    console.log("মাইক্রোফোন পাওয়া যায়নি, স্ক্রিন সাউন্ডে সুইচ করা হচ্ছে...");
                }

                // ২. স্ক্রিন সাউন্ড নেওয়ার চেষ্টা করা (Audio Filter Disable করে)
                const hasMic = micStreamObj && micStreamObj.getAudioTracks().length > 0;

                if (!hasMic) {
                    if (navigator.mediaDevices.getDisplayMedia) {
                        try {
                            displayStreamObj = await navigator.mediaDevices.getDisplayMedia({ 
                                video: true, 
                                audio: {
                                    echoCancellation: false,
                                    autoGainControl: false,
                                    noiseSuppression: false
                                } 
                            });
                        } catch (displayErr) {
                            console.log("স্ক্রিন শেয়ার বাতিল করা হয়েছে।");
                        }
                    }
                } else {
                    if (navigator.mediaDevices.getDisplayMedia) {
                        try {
                            displayStreamObj = await navigator.mediaDevices.getDisplayMedia({ 
                                video: true, 
                                audio: {
                                    echoCancellation: false,
                                    autoGainControl: false,
                                    noiseSuppression: false
                                } 
                            });
                        } catch (e) {}
                    }
                }

                const hasMicAudio = micStreamObj && micStreamObj.getAudioTracks().length > 0;
                const hasSysAudio = displayStreamObj && displayStreamObj.getAudioTracks().length > 0;

                // যদি কোনোটিই না থাকে
                if (!hasMicAudio && !hasSysAudio) {
                    alert("⚠️ কোনো মাইক্রোফোন বা স্ক্রিন অডিও পাওয়া যায়নি! স্ক্রিন শেয়ার করার সময় অবশ্যই 'Share audio' টিক মার্ক দিন।");
                    return;
                }

                // ৩. অডিও মিক্সিং
                const audioCtx = new AudioContext();
                const dest = audioCtx.createMediaStreamDestination();
                
                if (hasMicAudio) {
                    const micSource = audioCtx.createMediaStreamSource(micStreamObj);
                    micSource.connect(dest);
                }
                
                if (hasSysAudio) {
                    const sysSource = audioCtx.createMediaStreamSource(displayStreamObj);
                    sysSource.connect(dest);
                }
                
                localStream = dest.stream;
                peer = new Peer(); 
                
                peer.on('open', (id) => {
                    set(statusRef, { isLive: true, broadcasterId: id });
                    onDisconnect(statusRef).set({ isLive: false, broadcasterId: null });
                    
                    if (hasMicAudio && hasSysAudio) {
                        statusText.innerText = "স্ট্যাটাস: লাইভ চলছে (মাইক + স্ক্রিন সাউন্ড)...";
                    } else if (hasSysAudio) {
                        statusText.innerText = "স্ট্যাটাস: লাইভ চলছে (শুধুমাত্র স্ক্রিন সাউন্ড)...";
                    } else {
                        statusText.innerText = "স্ট্যাটাস: লাইভ চলছে (শুধুমাত্র মাইক)...";
                    }

                    statusText.style.color = "green";
                    startBtn.style.display = "none";
                    stopBtn.style.display = "inline-block";
                    
                    requestWakeLock();
                    
                    keepAliveInterval = setInterval(() => {
                        console.log("Broadcasting...");
                    }, 5000);
                });
                
                peer.on('call', (call) => call.answer(localStream));

                peer.on('disconnected', () => {
                    if (!peer.destroyed) {
                        peer.reconnect();
                    }
                });

                peer.on('error', (err) => {
                    console.log("PeerJS Error: ", err);
                });

            } catch (err) {
                alert("সম্প্রচার শুরু করতে সমস্যা হচ্ছে: " + err.message);
            }
        });

        stopBtn.addEventListener('click', () => {
            if (micStreamObj) micStreamObj.getTracks().forEach(t => t.stop());
            if (displayStreamObj) displayStreamObj.getTracks().forEach(t => t.stop());
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            if (peer) peer.destroy();
            set(statusRef, { isLive: false, broadcasterId: null });
            
            statusText.innerText = "স্ট্যাটাস: বন্ধ আছে";
            statusText.style.color = "red";
            startBtn.style.display = "inline-block";
            stopBtn.style.display = "none";
            
            if (wakeLock !== null) {
                wakeLock.release().then(() => wakeLock = null);
                wakeLockStatus.innerText = "";
            }
            if (keepAliveInterval) {
                clearInterval(keepAliveInterval);
            }
        });
    </script>
</body>
</html>
